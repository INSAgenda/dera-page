---
# Homepage configuration
# See https://fontawesome.com/v5/search for icons options
# See https://github.com/bastienwirtz/homer/blob/main/docs/configuration.md for documentation

title: "Bienvenue sur dera.page"
subtitle: "Liste des services"
documentTitle: "dera.page"
# logo: "assets/logo.png"

header: true
footer: '<p>Créé par <a href="https://alix.anneraud.fr">Alix</a>, <a href="https://github.com/DimitriTimoz">Dimitri</a> et <a href="https://github.com/Mubelotix">Simon</a></p>' # set false if you want to hide it.

columns: "auto" # "auto" or number (must be a factor of 12: 1, 2, 3, 4, 6, 12)
connectivityCheck: false

# Set the default layout and color scheme
defaults:
  layout: columns
  colorTheme: auto
  iconWidth: auto

# Optional theming
theme: default # 'default' or one of the themes available in 'src/assets/themes'.

stylesheet:
  - "assets/custom.css"

colors:
  light:
    highlight-primary: "#DC6ACF"
    highlight-secondary: "#f4a6eb"
    highlight-hover: "#f475e5"
    background: "#f5f5f5"
    card-background: "#ffffff"
    text: "#363636"
    text-header: "#424242"
    text-title: "#303030"
    text-subtitle: "#424242"
    card-shadow: rgba(0, 0, 0, 0.1)
    link: "#f475e5"
    link-hover: "#DC6ACF"
  dark:
    highlight-primary: "#DC6ACF"
    highlight-secondary: "#c15db6"
    highlight-hover: "#DC6ACF"
    background: "#241b22"
    card-background: "#393037"
    text: "#fafafa"
    text-header: "#fff"
    text-title: "#fafafa"
    text-subtitle: "#f5f5f5"
    card-shadow: none
    link: "#c15db6"
    link-hover: "#DC6ACF"

message:
  style: "is-info"
  title: "Rejoignez-nous !"
  icon: "far fa-lightbulb"
  content: |
    Vous aimez créer et héberger des services ? Nous pouvons vous aider et soutenir ! Voici les outils que nous pouvons mettre à votre disposition :
    <ul>
        <li>- Sous-domaine</li>
        <li>- Authentification</li>
        <li>- Envoi d'emails</li>
        <li>- Hébergement</li>
        <li>- Analytics (Umami)</li>
        <li>- Mise en avant</li>
    </ul>
    <br/>
    Nous sommes un groupe d'individus totalement indépendants. Si vous avez des questions, n'hésitez pas à nous contacter !

